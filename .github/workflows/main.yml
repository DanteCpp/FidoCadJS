# ---------------------------------------------------------------------------
# main.yml – CI trigger for the main branch
# ---------------------------------------------------------------------------
# Author   : Dante Loi
# Date     : 2026-05-15
# Brief    : Thin caller that invokes the reusable ci.yml pipeline.
# ---------------------------------------------------------------------------

name: CI — main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI pipeline
    uses: ./.github/workflows/ci.yml
