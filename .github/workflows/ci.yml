# ---------------------------------------------------------------------------
# ci.yml – CI pipeline for FidoCadJS
# ---------------------------------------------------------------------------
# Author    : Dante Loi
# Date      : 2026-05-17
# Brief     : Single flat CI workflow. Replaces the previous
#             dev.yml + main.yml + reusable-call split.
# Copyright : (c) 2026 Dante Loi
# Details   : Stage 1 — typecheck + lint in parallel.
#             Stage 2 — test + build, gated on stage 1 (fail-fast on lint).
#             Stage 3 — coverage gated on test.
#             Stage 4 — e2e (chromium / firefox / webkit matrix) gated on
#                       build; downloads the dist artifact and tests the
#                       production preview server, not the dev server.
#             Aggregator — `CI success` is the single required check.
# ---------------------------------------------------------------------------

name: CI

on:
  # Feature-branch model: develop on short-lived feature branches cut from
  # main and open a PR to main to get checks. Direct pushes to main (merges,
  # hotfixes) also run CI so deploy.yml can react to a green main build.
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------
  # Stage 1 — fast independent checks (run in parallel)
  # -----------------------------------------------------------------------

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v6
        id: deps
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v6
        id: deps
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run lint

  # -----------------------------------------------------------------------
  # Stage 2 — fail-fast on typecheck OR lint before expensive jobs run
  # -----------------------------------------------------------------------

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v6
        id: deps
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v6
        id: deps
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # -----------------------------------------------------------------------
  # Stage 3 — depends on unit tests
  # -----------------------------------------------------------------------

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v6
        id: deps
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

  # -----------------------------------------------------------------------
  # Stage 4 — E2E against the production preview server, all three engines
  # -----------------------------------------------------------------------

  e2e:
    name: E2E tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v6
        id: deps
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ matrix.browser }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            playwright-${{ runner.os }}-

      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e -- --project=${{ matrix.browser }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}-${{ github.run_id }}
          path: test/e2e/report/

  # -----------------------------------------------------------------------
  # Aggregator — single required status check for branch protection
  # -----------------------------------------------------------------------

  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, build, coverage, e2e]
    if: always()
    steps:
      - name: Fail if any upstream job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All CI checks passed."
