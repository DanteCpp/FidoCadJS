# ---------------------------------------------------------------------------
# audit.yml – Nightly dependency vulnerability audit
# ---------------------------------------------------------------------------
# Author    : Dante Loi
# Date      : 2026-05-17
# Brief     : Runs `npm audit` against production dependencies once a
#             day. Opens a tracking issue on failure so vulnerabilities
#             are not silently ignored. Manually triggerable.
# Copyright : (c) 2026 Dante Loi
# Details   : Moved out of the per-PR CI pipeline because audit drift
#             is rarely fixed by the PR author; daily cadence with a
#             tracked issue is the right escalation path.
# ---------------------------------------------------------------------------

name: Security Audit

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: audit
        run: npm audit --omit=dev --audit-level=high

      - name: Open tracking issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Security Audit failure';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            if (existing.data.some(i => i.title === title)) {
              core.info('Existing tracking issue found, skipping create.');
              return;
            }
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                '`npm audit --omit=dev --audit-level=high` failed on the nightly run.',
                '',
                `Run: ${runUrl}`,
                '',
                'Close this issue once the offending dependency has been bumped.',
              ].join('\n'),
            });
