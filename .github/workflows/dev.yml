# ---------------------------------------------------------------------------
# dev.yml – CI trigger for dev & refactor branches
# ---------------------------------------------------------------------------
# Author   : Dante Loi
# Date     : 2026-05-15
# Brief    : Thin caller that invokes the reusable ci.yml pipeline.
# ---------------------------------------------------------------------------

name: CI — dev & refactor

on:
  push:
    branches: [dev, refactor]
  pull_request:
    branches: [dev, refactor]

concurrency:
  group: ci-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI pipeline
    uses: ./.github/workflows/ci.yml
